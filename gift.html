<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món quà bất ngờ</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, #fff5f9 0%, #ffe0ee 100%);
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            display: block;
        }

        /* Lời chúc ở giữa khung trái tim */
        #wish {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }
        #wish p {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2rem, 7vw, 4.5rem);
            font-weight: 700;
            color: #be123c;
            text-align: center;
            padding: 0 1rem;
            margin: 0;
            opacity: 0;
            transform: scale(0.9);
            text-shadow: 0 0 24px rgba(255, 255, 255, 0.95), 0 0 8px rgba(255, 255, 255, 0.9);
            transition: opacity 2.2s ease, transform 2.2s ease;
        }
        #wish.show p {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="wish">
        <p>Chúc mừng sinh nhật Ty</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const wish = document.getElementById('wish');

        // Danh sách ảnh nhỏ dùng để ghép thành trái tim
        const IMAGE_FILES = [
            'images/1.jpg', 'images/2.jpg', 'images/3.jpg', 'images/4.jpg', 'images/5.jpg',
            'images/6.jpg', 'images/7.jpg', 'images/8.jpg', 'images/9.jpg', 'images/10.jpg'
        ];

        const PARTICLE_COUNT = 90;

        const images = [];
        let loadedCount = 0;

        let W = 0;
        let H = 0;
        let particles = [];
        let startTime = 0;
        let lastWidth = 0;

        // Tải trước toàn bộ ảnh
        IMAGE_FILES.forEach(function (src) {
            const img = new Image();
            img.onload = function () {
                loadedCount++;
                if (loadedCount === IMAGE_FILES.length) {
                    start();
                }
            };
            img.src = src;
            images.push(img);
        });

        // Trái tim: lấy điểm trên đường cong tham số
        function heartPoints(count, scale, cx, cy) {
            const points = [];
            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                points.push({ x: cx + x * scale, y: cy - y * scale });
            }
            return points;
        }

        function easeOutCubic(k) {
            return 1 - Math.pow(1 - k, 3);
        }

        function lerp(a, b, k) {
            return a + (b - a) * k;
        }

        // Khởi tạo các ảnh nhỏ: rơi từ trên xuống, tụ vào giữa rồi ghép thành trái tim
        function buildParticles() {
            const scale = Math.min(W * 0.8 / 32, H * 0.72 / 29);
            const targets = heartPoints(PARTICLE_COUNT, scale, W / 2, H * 0.47);

            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    image: images[i % images.length],
                    size: 38 + Math.random() * 14,

                    // điểm bắt đầu phía trên màn hình
                    sx: Math.random() * W,
                    sy: -60 - Math.random() * H,

                    // điểm tụ ở giữa màn hình
                    gx: W / 2 + (Math.random() - 0.5) * W * 0.3,
                    gy: H * 0.5 + (Math.random() - 0.5) * H * 0.12,

                    // đích cuối cùng trên khung trái tim
                    tx: targets[i].x,
                    ty: targets[i].y,

                    delay: Math.random() * 0.9,
                    fallDur: 0.8 + Math.random() * 0.5,
                    convDur: 0.8 + Math.random() * 0.4,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 4
                });
            }
        }

        // Vị trí của một ảnh tại thời điểm time (giây)
        function positionAt(p, time) {
            const t = time - p.delay;
            if (t <= 0) return { x: p.sx, y: p.sy, alpha: 0 };

            // Giai đoạn 1: rơi tự do xuống giữa màn hình
            if (t < p.fallDur) {
                const k = t / p.fallDur;
                return {
                    x: lerp(p.sx, p.gx, k),
                    y: lerp(p.sy, p.gy, k * k),
                    alpha: 1
                };
            }

            // Giai đoạn 2: hội tụ và ghép vào khung trái tim
            const t2 = t - p.fallDur;
            if (t2 < p.convDur) {
                const k = easeOutCubic(t2 / p.convDur);
                return {
                    x: lerp(p.gx, p.tx, k),
                    y: lerp(p.gy, p.ty, k),
                    alpha: 1
                };
            }

            // Đã vào đúng vị trí
            return { x: p.tx, y: p.ty, alpha: 1 };
        }

        function draw(time) {
            ctx.clearRect(0, 0, W, H);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const pos = positionAt(p, time);
                if (pos.alpha === 0) continue;

                const spinTime = Math.min(time - p.delay, p.fallDur + p.convDur);
                const radius = p.size / 2;

                ctx.save();
                ctx.globalAlpha = pos.alpha;
                ctx.translate(pos.x, pos.y);
                if (spinTime > 0) {
                    ctx.rotate(p.rot + p.rotSpeed * spinTime);
                }

                // Cắt ảnh thành hình tròn
                ctx.save();
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(p.image, -radius, -radius, p.size, p.size);
                ctx.restore();

                // Viền trắng cho từng ảnh
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.stroke();

                ctx.restore();
            }
        }

        function loop() {
            const time = (performance.now() - startTime) / 1000;
            draw(time);
            requestAnimationFrame(loop);
        }

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        // Tính tổng thời gian để tất cả các ảnh ghép xong vào trái tim
        function totalDuration() {
            let max = 0;
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const done = p.delay + p.fallDur + p.convDur;
                if (done > max) max = done;
            }
            return max;
        }

        let running = false;

        function start() {
            if (running) return;
            running = true;

            resize();
            buildParticles();
            lastWidth = W;
            startTime = performance.now();
            wish.classList.remove('show');
            loop();

            // Hiện dần lời chúc sau khi trái tim đã ghép xong
            setTimeout(function () {
                wish.classList.add('show');
            }, (totalDuration() + 0.3) * 1000);
        }

        // Nếu ảnh tải quá lâu thì vẫn bắt đầu để không bị treo trang
        setTimeout(start, 2500);

        // Chỉ dựng lại khi chiều rộng thay đổi (bỏ qua thay đổi chiều cao của thanh địa chỉ trên mobile)
        window.addEventListener('resize', function () {
            if (!running || window.innerWidth === lastWidth) return;
            resize();
            buildParticles();
            lastWidth = W;
            startTime = performance.now();
            wish.classList.remove('show');
            setTimeout(function () {
                wish.classList.add('show');
            }, (totalDuration() + 0.3) * 1000);
        });
    </script>
</body>
</html>
