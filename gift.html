<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món quà bất ngờ</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            background-color: #fff5f9; /* màu nền cơ bản */
        }

        /* Lớp nền gradient tách biệt để hỗ trợ z-index cho sparkles */
        #bg-gradient {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(180deg, #fff5f9 0%, #ffe0ee 100%);
        }

        /* Sân khấu chứa toàn bộ ảnh rơi */
        #stage {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        /* Khung ảnh nhỏ: hình chữ nhật bo góc, có viền mỏng và đổ bóng */
        .photo {
            position: absolute;
            top: -100%;            /* ban đầu nằm ngoài màn hình phía trên */
            box-sizing: border-box;
            padding: 3px;
            border-radius: 0.7rem;
            background-color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 18px rgba(190, 24, 93, 0.25);
            will-change: top, left, transform;
            z-index: 10;           /* Tăng z-index để nằm trên sparkles */
        }
        .photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
        }

        /* Lời chúc ở trung tâm trái tim */
        #wish {
            position: absolute;
            left: 50%;
            top: 47%;
            transform: translate(-50%, -50%) scale(0.9);
            margin: 0;
            z-index: 9999;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: clamp(2rem, 7vw, 4.5rem);
            color: #be123c;
            text-align: center;
            padding: 0 1rem;
            opacity: 0;
            text-shadow: 0 0 26px rgba(255, 255, 255, 1), 0 0 10px rgba(255, 255, 255, 0.95);
            transition: opacity 1.8s ease, transform 1.8s ease;
            pointer-events: none;
        }
        #wish.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Lớp đốm sáng lấp lánh: nằm trên nền nhưng dưới ảnh */
        #sparkles {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        /* Container cho một cụm ngôi sao */
        .sparkle-cluster {
            position: absolute;
            will-change: opacity, transform;
        }

        /* Mỗi ngôi sao SVG trong cụm */
        .sparkle-svg {
    position: absolute;
    fill: #ff80ab;        /* Đổi sang màu hồng (Pink) */
    stroke: #e91e63;      /* Đổi viền sang màu hồng đậm (hoặc để 'none' nếu không muốn viền) */
    stroke-width: 1.5px;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 4px rgba(255, 128, 171, 0.8)); /* Đổi bóng mờ (glow) sang tone hồng */
    animation-name: twinkle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
}

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(0.8) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.1) rotate(5deg);
            }
        }
    </style>
</head>
<body>

    <div id="bg-gradient"></div>
    <div id="sparkles"></div>

    <div id="stage">
        <p id="wish">Chúc mừng sinh nhật Ty</p>
    </div>

    <script>
        const stage = document.getElementById('stage');
        const wish = document.getElementById('wish');
        const sparkleLayer = document.getElementById('sparkles');

        // Danh sách ảnh dùng để xếp thành trái tim
        const IMAGE_FILES = [
            'images/1.jpg', 'images/2.jpg', 'images/3.jpg', 'images/4.jpg', 'images/5.jpg',
            'images/6.jpg', 'images/7.jpg', 'images/8.jpg', 'images/9.jpg', 'images/10.jpg'
        ];

        // Tăng số lượng ảnh lên 80 để trái tim đặc hơn khi phóng to
        const PHOTO_COUNT = 80; 

        let W = 0;
        let H = 0;
        let lastWidth = 0;
        let running = false;
        let landed = 0;

        // Tọa độ các điểm trên đường cong trái tim
        function heartPoints(count, scale, cx, cy) {
            const points = [];
            for (let i = 0; i < count; i++) {
                const t = (i / count) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                points.push({ x: cx + x * scale, y: cy - y * scale });
            }
            return points;
        }

        function randomBetween(min, max) {
            return min + Math.random() * (max - min);
        }

        // Sinh các ngôi sao nét vẽ tay (SVG) theo cụm (to và nhỏ đi kèm nhau)
        function spawnSparkles() {
            sparkleLayer.innerHTML = '';

            // Chỉ dùng hình dạng ngôi sao 4 cánh nét vẽ tay từ ảnh mẫu
            const STAR_PATH = "M12 2C13 9 16 11 22 12C16 13 13 15 12 22C11 15 8 13 2 12C8 11 11 9 12 2Z";

            const CLUSTER_COUNT = 30; // Số lượng cụm ngôi sao
            const cols = Math.max(1, Math.round(Math.sqrt(CLUSTER_COUNT * (W / Math.max(H, 1)))));
            const rows = Math.max(1, Math.ceil(CLUSTER_COUNT / cols));
            const cellW = W / cols;
            const cellH = H / rows;

            const zoom = (W < 640 || H < 640) ? 1 : 1.5;
            const scale = Math.min(W * 0.82 / 32, H * 0.72 / 29) * zoom;
            const cx = W / 2;
            const cy = H * 0.47;
            const exR = scale * 18; 
            const eyR = scale * 15;

            for (let i = 0; i < CLUSTER_COUNT; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);

                const clusterLeft = (col + randomBetween(0.1, 0.9)) * cellW;
                const clusterTop = (row + randomBetween(0.1, 0.9)) * cellH;

                const dx = clusterLeft - cx;
                const dy = clusterTop - cy;
                if ((dx * dx) / (exR * exR) + (dy * dy) / (eyR * eyR) < 1.2) continue;

                const cluster = document.createElement('div');
                cluster.className = 'sparkle-cluster';
                cluster.style.left = clusterLeft + 'px';
                cluster.style.top = clusterTop + 'px';

                // Trong mỗi cụm có 1 ngôi sao to và 1-2 ngôi sao nhỏ đi kèm
                const sizes = [randomBetween(30, 45), randomBetween(12, 18)];
                if (Math.random() > 0.5) sizes.push(randomBetween(8, 12));

                sizes.forEach((size, idx) => {
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute("viewBox", "0 0 24 24");
                    svg.setAttribute("class", "sparkle-svg");
                    svg.style.width = size + "px";
                    svg.style.height = size + "px";
                    
                    // Vị trí tương đối trong cụm: sao to ở tâm (0,0), sao nhỏ lệch ra
                    if (idx === 0) {
                        svg.style.left = '0px';
                        svg.style.top = '0px';
                    } else {
                        svg.style.left = randomBetween(-25, 25) + 'px';
                        svg.style.top = randomBetween(-25, 25) + 'px';
                    }
                    
                    svg.style.animationDelay = randomBetween(0, 2).toFixed(2) + 's';
                    svg.style.animationDuration = randomBetween(1, 2).toFixed(2) + 's';

                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", STAR_PATH);
                    svg.appendChild(path);
                    cluster.appendChild(svg);
                });

                sparkleLayer.appendChild(cluster);
            }
        }

        // Tạo toàn bộ ảnh và chạy hiệu ứng rơi
        function spawnPhotos() {
            landed = 0;

            const photoWidth = Math.max(44, Math.min(72, W * 0.052));
            const photoHeight = photoWidth * 1.28;
            
            // Hệ số phóng to: màn hình lớn thì phóng 1.5x cho nổi bật,
            // màn hình nhỏ (điện thoại) giữ 1x để trái tim không tràn khung
            const zoom = (W < 640 || H < 640) ? 1 : 1.5;
            const scale = Math.min(W * 0.82 / 32, H * 0.72 / 29) * zoom;
            
            const targets = heartPoints(PHOTO_COUNT, scale, W / 2, H * 0.47);

            let maxTotal = 0;

            for (let i = 0; i < PHOTO_COUNT; i++) {
                const photo = document.createElement('div');
                photo.className = 'photo';
                photo.style.width = photoWidth + 'px';
                photo.style.height = photoHeight + 'px';
                // xếp chồng lên nhau một cách tự nhiên (bắt đầu từ 10 để trên sparkles)
                photo.style.zIndex = 10 + Math.floor(Math.random() * 100);

                const img = document.createElement('img');
                img.src = IMAGE_FILES[i % IMAGE_FILES.length];
                img.alt = '';
                photo.appendChild(img);

                // Vị trí bắt đầu: ngoài màn hình phía trên, lệch ngẫu nhiên
                const startLeft = randomBetween(-photoWidth, W - photoWidth);
                const startRot = randomBetween(-60, 60);
                const midRot = startRot + randomBetween(-90, 90);
                const endRot = randomBetween(-14, 14);

                photo.style.left = startLeft + 'px';
                photo.style.transform = 'rotate(' + startRot + 'deg)';
                stage.appendChild(photo);

                // Điểm tụ ở giữa màn hình trước khi ghép vào trái tim
                const gatherLeft = W / 2 + randomBetween(-W * 0.18, W * 0.18) - photoWidth / 2;
                const gatherTop = H * 0.5 + randomBetween(-H * 0.08, H * 0.08);

                // Điểm dừng cuối cùng trên khung trái tim
                const targetLeft = targets[i].x - photoWidth / 2;
                const targetTop = targets[i].y - photoHeight / 2;

                // Thông số ngẫu nhiên: độ trễ, tốc độ rơi, thời gian hội tụ
                // Tăng thông số thời gian (giây) để hiệu ứng chậm lại
const delay = randomBetween(0, 1.5);            // Ảnh xuất hiện thưa nhau hơn
const fallDuration = randomBetween(2.0, 3.5);   // Rơi chậm hơn (từ 2 đến 3.5 giây)
const convergeDuration = randomBetween(1.5, 2.5); // Bay vào xếp trái tim chậm hơn (từ 1.5 đến 2.5 giây)

                const total = delay + fallDuration + convergeDuration;
                if (total > maxTotal) maxTotal = total;

                setTimeout(function () {
                    // Giai đoạn 1: rơi tự do xuống giữa màn hình
                    photo.style.transition =
                        'top ' + fallDuration + 's cubic-bezier(0.45, 0, 0.9, 0.5), ' +
                        'left ' + fallDuration + 's linear, ' +
                        'transform ' + fallDuration + 's linear';
                    photo.style.top = gatherTop + 'px';
                    photo.style.left = gatherLeft + 'px';
                    photo.style.transform = 'rotate(' + midRot + 'deg)';

                    photo.addEventListener('transitionend', function onFallEnd(event) {
                        if (event.propertyName !== 'top') return;
                        photo.removeEventListener('transitionend', onFallEnd);

                        // Giai đoạn 2: hội tụ và ghép vào đúng vị trí trên khung trái tim
                        photo.style.transition =
                            'top ' + convergeDuration + 's cubic-bezier(0.2, 0.8, 0.2, 1), ' +
                            'left ' + convergeDuration + 's cubic-bezier(0.2, 0.8, 0.2, 1), ' +
                            'transform ' + convergeDuration + 's cubic-bezier(0.2, 0.8, 0.2, 1)';
                        photo.style.top = targetTop + 'px';
                        photo.style.left = targetLeft + 'px';
                        photo.style.transform = 'rotate(' + endRot + 'deg)';

                        photo.addEventListener('transitionend', function onConvergeEnd(event2) {
                            if (event2.propertyName !== 'top') return;
                            photo.removeEventListener('transitionend', onConvergeEnd);
                            landed++;
                            // Ảnh cuối cùng vào vị trí -> hiện dần lời chúc
                            if (landed === PHOTO_COUNT) {
                                wish.classList.add('show');
                            }
                        });
                    });
                }, delay * 1000);
            }

            // Dự phòng: nếu có ảnh bị kẹt thì vẫn hiện lời chúc
            setTimeout(function () {
                wish.classList.add('show');
            }, (maxTotal + 0.5) * 1000);
        }

        function restart() {
            stage.querySelectorAll('.photo').forEach(function (photo) {
                photo.remove();
            });
            wish.classList.remove('show');
            W = window.innerWidth;
            H = window.innerHeight;
            lastWidth = W;
            spawnSparkles();
            spawnPhotos();
        }

        function start() {
            if (running) return;
            running = true;
            W = window.innerWidth;
            H = window.innerHeight;
            lastWidth = W;
            spawnSparkles();
            spawnPhotos();
        }

        // Tải trước ảnh rồi mới bắt đầu hiệu ứng
        let loaded = 0;
        IMAGE_FILES.forEach(function (src) {
            const img = new Image();
            img.onload = function () {
                loaded++;
                if (loaded === IMAGE_FILES.length) start();
            };
            img.src = src;
        });

        // Nếu ảnh tải quá lâu thì vẫn chạy để không treo trang
        setTimeout(start, 2500);

        // Dựng lại khi chiều rộng thay đổi (bỏ qua thay đổi chiều cao do thanh địa chỉ trên mobile)
        window.addEventListener('resize', function () {
            if (running && window.innerWidth !== lastWidth) restart();
        });
    </script>
</body>
</html>
