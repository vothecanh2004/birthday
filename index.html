<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập ngày sinh của bạn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Thiết lập phông chữ và nền hồng nhạt toàn màn hình */
        body {
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            background-color: #fdf2f8;
        }
        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        /* Khung chứa các icon quả dâu tây trôi nổi */
        #berry-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        /* Icon quả dâu tây trôi nổi ngẫu nhiên */
        .berry {
            position: absolute;
            bottom: -15%;
            animation-name: float-berry;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            will-change: transform, opacity;
        }

        @keyframes float-berry {
            0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.85; }
            25%  { transform: translate(30px, -30vh) rotate(90deg); }
            50%  { transform: translate(-28px, -62vh) rotate(180deg); }
            75%  { transform: translate(26px, -92vh) rotate(270deg); }
            90%  { opacity: 0.85; }
            100% { transform: translate(0, -125vh) rotate(360deg); opacity: 0; }
        }

        /* Nhịp tim đập cho ảnh đại diện */
        @keyframes pulse-heart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-heart {
            animation: pulse-heart 2s infinite;
        }

        /* Lắc khung khi nhập sai */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }

        /* Phím số trên bàn phím ảo */
        .key {
            padding: 0.85rem 0;
            border-radius: 1rem;
            background-color: #ffffff;
            border: 1px solid #fbcfe8;
            color: #be185d;
            font-size: 1.25rem;
            font-weight: 700;
            box-shadow: 0 1px 3px rgba(190, 24, 93, 0.1);
            transition: transform 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease;
            cursor: pointer;
            user-select: none;
        }
        .key:hover {
            background-color: #fdf2f8;
        }
        .key:active {
            transform: scale(0.93);
        }

        /* Nút "C" và "✔" màu cam nhạt nổi bật */
        .key-orange {
            background: linear-gradient(180deg, #ffd8a8 0%, #ffbe76 100%);
            border-color: #ffc078;
            color: #9a3412;
            box-shadow: 0 4px 12px rgba(255, 159, 64, 0.35);
        }
        .key-orange:hover {
            background: linear-gradient(180deg, #ffc98c 0%, #ffab52 100%);
        }
        .key-ok {
            background: linear-gradient(180deg, #ffc078 0%, #ff9f43 100%);
            color: #7c2d12;
        }
        .key-ok:hover {
            background: linear-gradient(180deg, #ffb35c 0%, #ff8f1f 100%);
        }
    </style>
</head>
<body class="w-screen h-screen relative text-gray-800">

    <!-- Các icon quả dâu tây trôi nổi -->
    <div id="berry-container"></div>

    <!-- Khung trung tâm -->
    <div class="relative z-10 flex items-center justify-center w-full h-full p-4">
        <div id="login-card"
            class="w-full max-w-3xl bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl border border-pink-100 p-6 md:p-8 flex flex-col md:flex-row items-center gap-6 md:gap-10">

           <div class="shrink-0">
    <img src="images/avatar.jpg"
        alt="Ảnh đại diện"
        class="w-28 h-28 md:w-40 md:h-40 object-cover rounded-full border-4 border-pink-200 shadow-lg animate-pulse-heart">
</div>

            <!-- Khu vực nhập liệu bên phải -->
            <div class="flex-1 w-full">
                <h1 class="text-2xl md:text-3xl font-bold text-rose-600 mb-4 text-center md:text-left">
                    Nhập ngày sinh của bạn.......
                </h1>

                <input type="password" id="password-input" readonly inputmode="none" placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-2xl border border-pink-200 bg-pink-50/50 focus:outline-none focus:ring-2 focus:ring-rose-300 focus:border-transparent text-center text-xl tracking-[0.3em] mb-4 transition-all">

                <p id="error-message" class="hidden text-rose-500 text-sm text-center mb-3">
                    Sai ngày sinh rồi, thử lại nha! 💔
                </p>

                <!-- Bàn phím ảo -->
                <div class="grid grid-cols-3 gap-3">
                    <button type="button" class="key" data-key="1">1</button>
                    <button type="button" class="key" data-key="2">2</button>
                    <button type="button" class="key" data-key="3">3</button>
                    <button type="button" class="key" data-key="4">4</button>
                    <button type="button" class="key" data-key="5">5</button>
                    <button type="button" class="key" data-key="6">6</button>
                    <button type="button" class="key" data-key="7">7</button>
                    <button type="button" class="key" data-key="8">8</button>
                    <button type="button" class="key" data-key="9">9</button>
                    <button type="button" class="key key-orange" data-key="clear">X</button>
                    <button type="button" class="key" data-key="0">0</button>
                    <button type="button" class="key key-orange key-ok" data-key="ok">✔</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mật khẩu ngày sinh định trước (bạn có thể thay đổi tại đây)
        const CORRECT_PASSWORD = "13112001";

        const input = document.getElementById('password-input');
        const errorMessage = document.getElementById('error-message');
        const loginCard = document.getElementById('login-card');

        // Liên kết bàn phím ảo với ô input
        document.querySelectorAll('.key').forEach(function (button) {
            button.addEventListener('click', function () {
                const key = button.dataset.key;

                if (key === 'clear') {
                    // Xóa ký tự vừa nhập
                    input.value = input.value.slice(0, -1);
                } else if (key === 'ok') {
                    // Xác nhận
                    checkPassword();
                } else {
                    // Nhập số
                    input.value += key;
                }

                errorMessage.classList.add('hidden');
            });
        });

        // Kiểm tra mật khẩu ngày sinh
        function checkPassword() {
            if (input.value === CORRECT_PASSWORD) {
                // Đúng thì điều hướng sang trang chúc sinh nhật
                window.location.href = 'birthday.html';
            } else {
                // Sai thì hiện thông báo và lắc khung
                errorMessage.classList.remove('hidden');
                loginCard.classList.add('shake');
                setTimeout(function () {
                    loginCard.classList.remove('shake');
                }, 500);
            }
        }

        // Tạo các icon quả dâu tây trôi nổi ngẫu nhiên
        function createBerries() {
            const container = document.getElementById('berry-container');
            const BERRY_COUNT = 16;

            for (let i = 0; i < BERRY_COUNT; i++) {
                const berry = document.createElement('span');
                berry.className = 'berry';
                berry.textContent = '🍓';

                // Vị trí, kích thước, tốc độ và độ trễ ngẫu nhiên
                berry.style.left = (Math.random() * 100) + '%';
                berry.style.fontSize = (Math.random() * 24 + 16) + 'px';

                const duration = Math.random() * 10 + 10;
                berry.style.animationDuration = duration + 's';
                // Delay âm để các quả dâu đã ở rải rác trên màn hình ngay từ đầu
                berry.style.animationDelay = (-Math.random() * duration) + 's';

                container.appendChild(berry);
            }
        }

        createBerries();
    </script>
</body>
</html>
